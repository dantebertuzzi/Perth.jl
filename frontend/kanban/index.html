<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perth · kanban</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#9558b2">
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="stylesheet" href="/style.css">
  <script>
    // aplica o tema antes do primeiro paint para evitar flash. Origens
    // (portas) têm localStorage separados, então o botão de troca
    // gantt<->kanban traz as preferências na URL (pref-theme etc.).
    try {
      const pt = new URLSearchParams(location.search).get("pref-theme");
      if (pt === "dark" || pt === "light")
        localStorage.setItem("perth-theme", pt);
    } catch (e) { /* segue com o que estiver salvo */ }
    document.documentElement.dataset.theme =
      localStorage.getItem("perth-theme") ||
      localStorage.getItem("perth-kanban-theme") || "dark";
  </script>
</head>
<body>

  <header class="menubar" id="menubar">
    <a class="brand" id="brand-link" href="https://github.com/dantebertuzzi/Perth.jl" target="_blank" rel="noopener" title="Perth.jl on GitHub"><img src="/logo.png" alt="" class="brand-logo"> Perth</a>
    <button class="board-chip" id="board-name" data-action="boards" title="Switch board">board</button>

    <nav class="menus">
      <div class="menu" data-menu="board">
        <button class="menu-title">Board</button>
        <div class="menu-drop">
          <button data-action="new-card">New card <kbd>N</kbd></button>
          <button data-action="new-col">New column…</button>
          <hr>
          <button data-action="undo">Undo <kbd>Ctrl+Z</kbd></button>
          <button data-action="redo">Redo <kbd>Ctrl+Shift+Z</kbd></button>
          <hr>
          <button data-action="boards">Boards…</button>
          <button data-action="archived">Archived cards…</button>
          <button data-action="activity">Activity…</button>
          <button data-action="metrics">Metrics…</button>
          <button data-action="share">Share / QR…</button>
          <button data-action="aliases" id="aliases-item" hidden>Rename machines…</button>
          <button data-action="permissions" id="permissions-item" hidden>Permissions…</button>
          <button data-action="autoarch" id="autoarch-item" hidden>Auto-archive…</button>
          <hr>
          <button data-action="delete-card" class="danger">Delete selected card <kbd>Del</kbd></button>
          <button data-action="reset" id="reset-item" class="danger" hidden>Reset board…</button>
        </div>
      </div>
      <div class="menu" data-menu="view">
        <button class="menu-title">View</button>
        <div class="menu-drop">
          <button data-action="toggle-theme">Dark mode <kbd>D</kbd></button>
          <button data-action="presentation">Presentation mode <kbd>P</kbd></button>
          <button data-action="resync">Resync with server</button>
        </div>
      </div>
    </nav>

    <div class="mb-search">
      <input id="search" placeholder="filter cards…  ( / )" autocomplete="off" spellcheck="false">
    </div>

    <div class="mb-right">
      <div class="peers" id="peers" title="connected machines"></div>
      <span class="mb-sep"></span>
      <span class="conn" id="conn"><span class="conn-dot"></span><span id="conn-label">connecting…</span></span>
      <span class="mb-sep"></span>
      <button class="icon-btn" id="share-toggle" data-action="share-toggle" hidden
              title="Transmit to your network" aria-label="Transmit to your network" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M8.1 8.1a5.5 5.5 0 0 0 0 7.8M15.9 15.9a5.5 5.5 0 0 0 0-7.8M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 18.8a9.6 9.6 0 0 0 0-13.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="mb-sep"></span>
      <button class="icon-btn" id="chat-toggle" title="Chat" aria-label="Chat">
        <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9.5L5 20.5a.8.8 0 0 1-1.3-.62V5z"/></svg>
        <span class="chat-badge" id="chat-badge" hidden></span>
      </button>
      <span class="mb-sep"></span>
      <div class="menu" data-menu="help">
        <button class="menu-title">Help</button>
        <div class="menu-drop">
          <button data-action="shortcuts">Keyboard shortcuts</button>
        </div>
      </div>
      <div class="menu settings-menu" data-menu="settings">
        <button class="menu-title icon-btn" title="Interface settings" aria-label="Interface settings">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="6" r="2.2" fill="currentColor"/><circle cx="8" cy="12" r="2.2" fill="currentColor"/><circle cx="16" cy="18" r="2.2" fill="currentColor"/></svg>
        </button>
        <div class="menu-drop settings-drop">
          <label for="name-input">your name (shown on your cursor)</label>
          <input id="name-input" maxlength="24" placeholder="e.g. dante" autocomplete="off">
          <div class="settings-hint">empty = shows the machine IP only</div>
          <div class="settings-check">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4.5v-15L7 9H3z"/><path d="M14.5 8.6v6.8a3.9 3.9 0 0 0 0-6.8z"/><path d="M14.5 4.3v2.1a6.2 6.2 0 0 1 0 11.2v2.1a8.2 8.2 0 0 0 0-15.4z"/></svg>
            <span class="sp-label">notification sound</span>
            <button class="toggle" id="sound-toggle" aria-pressed="true" aria-label="notification sound"></button>
          </div>
          <div class="settings-check">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M2 2l20 20M9.9 5.2A10.4 10.4 0 0 1 12 5c6 0 9.6 5.5 9.9 6a11.7 11.7 0 0 1-2.7 3.2M6.6 6.6C3.6 8.4 2.1 11 2.1 11a11.9 11.9 0 0 0 3.4 4.1A10.7 10.7 0 0 0 12 17c.9 0 1.8-.1 2.5-.4M9.9 12.1a2.2 2.2 0 0 0 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="sp-label">hide other people's cursors</span>
            <button class="toggle" id="hide-cursors-toggle" aria-pressed="false" aria-label="hide other people's cursors"></button>
          </div>
          <div class="settings-check">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5v-13Zm2.4 12.1h13.2l-4.3-5.8-3.1 4-2.2-2.6-3.6 4.4ZM8.4 9.9a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Z"/></svg>
            <span class="sp-label">hide background image</span>
            <button class="toggle" id="hide-bg-toggle" aria-pressed="false" aria-label="hide background image"></button>
          </div>
          <div class="settings-check">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M12 3.1l1.9 4.5 4.9.4-3.7 3.2 1.1 4.8-4.2-2.6-4.2 2.6 1.1-4.8-3.7-3.2 4.9-.4L12 3.1Z"/><path d="M18.6 16.2l.7 1.7 1.8.2-1.4 1.2.4 1.8-1.5-1-1.6 1 .4-1.8-1.3-1.2 1.8-.2.7-1.7Z"/></svg>
            <span class="sp-label">hide new-card badges</span>
            <button class="toggle" id="hide-new-toggle" aria-pressed="false" aria-label="hide new-card badges"></button>
          </div>
          <div class="settings-lang">
            <svg class="sp-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 12h17M12 3.4c2.2 2.3 3.3 5.2 3.3 8.6s-1.1 6.3-3.3 8.6c-2.2-2.3-3.3-5.2-3.3-8.6S9.8 5.7 12 3.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <label for="lang-select">Language</label>
            <select id="lang-select"></select>
          </div>
        </div>
      </div>
      <button class="switch" id="theme-switch" data-action="toggle-theme" title="Toggle dark mode (D)" aria-label="Toggle dark mode">
        <span class="knob">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
      </button>
      <button class="icon-btn" id="presentation-toggle" data-action="presentation" title="Presentation mode (P)" aria-label="Presentation mode">
        <svg viewBox="0 0 24 24"><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="app-switch" title="Open Gantt" aria-label="Open Gantt">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="10" height="3.4" rx="1.2"/><rect x="7" y="10.3" width="14" height="3.4" rx="1.2"/><rect x="5" y="15.6" width="8" height="3.4" rx="1.2"/></svg>
      </button>
      <span class="mb-sep"></span>
      <a class="icon-btn" id="gh-link" href="https://github.com/dantebertuzzi/Perth.jl" target="_blank" rel="noopener" title="Source on GitHub">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </div>
  </header>

  <!-- Botão flutuante para sair do modo apresentação (a menubar some junto
       com o botão que o abriu) -->
  <button class="icon-btn presentation-exit" data-action="presentation" title="Exit presentation mode (Esc)" aria-label="Exit presentation mode">
    <svg viewBox="0 0 24 24"><path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <main class="board" id="board"></main>

  <footer class="statusbar">
    <span id="st-board"></span>
    <span class="spacer"></span>
    <span id="st-me"></span>
    <span id="st-rev"></span>
  </footer>

  <div id="cursors"></div>
  <div id="modal-root" hidden></div>
  <div id="toasts"></div>

  <div class="chat-panel" id="chat-panel" hidden>
    <div class="chat-head">
      <span>Chat</span>
      <button id="chat-close" title="Close (Esc)">✕</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-typing" id="chat-typing" hidden></div>
    <form class="chat-form" id="chat-form">
      <textarea id="chat-input" rows="1" maxlength="2000"
                placeholder="Message the board…" autocomplete="off"></textarea>
      <button type="submit" title="Send (Enter)">Send</button>
    </form>
  </div>

  <script src="/shared/i18n.js"></script>
  <script src="/shared/draggable.js"></script>
  <script src="/shared/background.js"></script>
  <script src="/shared/shortcuts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
