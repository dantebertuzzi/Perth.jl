name: Frontend
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: syntax + DOM tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: o teste de navegador fala DevTools pelo WebSocket global, que
          # não existe no 20 (ver test/browser/cdp.js)
          node-version: "22"
      - run: |
          node --check frontend/app.js
          node --check frontend/kanban/app.js
          node --check frontend/shared/presence.js
          node --check frontend/shared/i18n.js
          node --check frontend/shared/sw.js
      - run: npm install --no-save jsdom
        working-directory: test/frontend
      - run: node run.js
        working-directory: test/frontend

      # Geometria e eventos de verdade: o que o jsdom não vê (largura de
      # campo, cadeia de clique, rolagem). Sem navegador na máquina o script
      # se declara pulado e sai com 0 — o runner do GitHub traz Chrome.
      - run: node run.js
        working-directory: test/browser
