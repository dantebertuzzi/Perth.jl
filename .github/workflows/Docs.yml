name: Docs
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: julia --project=docs -e '
          using Pkg;
          Pkg.develop(PackageSpec(path = pwd()));
          Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A landing page (`web/`) mora na **raiz** do `gh-pages`, ao lado do que o
      # Documenter publica em `dev/`, `stable/` e `previews/`. Este passo roda depois
      # do deploy da documentação de propósito: o Documenter reescreve o `index.html`
      # da raiz a cada publicação, e sem isto a landing duraria até o próximo build.
      - name: Landing page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cp web/index.html web/favicon.svg site/
          rm -rf site/media && cp -r web/media site/media
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg media
          git diff --cached --quiet || git commit -m "Landing page: $GITHUB_SHA"
          git push
